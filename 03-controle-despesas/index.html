
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Despesas Pessoais</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Cabeçalho -->
        <header>
            <h1>Controle de Despesas</h1>
            <p>Organize suas finanças pessoais</p>
        </header>

        <!-- Resumo financeiro -->
        <section class="resumo">

            <div class="card saldo">
                <h2>Saldo Total</h2>
                <p id="saldo-total">R$ 0,00</p>
            </div>

            <div class="card receitas">
                <h2>Receitas</h2>
                <p id="total-receitas">R$ 0,00</p>
            </div>

            <div class="card despesas">
                <h2>Despesas</h2>
                <p id="total-despesas">R$ 0,00</p>
            </div>

        </section>

        <!-- Cadastro de transações -->
        <section class="cadastro">

            <h2>Nova Transação</h2>

            <form id="form-transacao">

                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Supermercado"
                    required
                >

                <label for="valor">Valor (R$)</label>
                <input
                    type="number"
                    id="valor"
                    placeholder="Ex: 150.00"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="tipo">Tipo</label>
                <select id="tipo" required>
                    <option value="">Selecione</option>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>

                <label for="categoria">Categoria</label>
                <select id="categoria" required>
                    <option value="">Selecione</option>
                    <option value="alimentacao">Alimentação</option>
                    <option value="transporte">Transporte</option>
                    <option value="moradia">Moradia</option>
                    <option value="saude">Saúde</option>
                    <option value="lazer">Lazer</option>
                    <option value="salario">Salário</option>
                    <option value="outros">Outros</option>
                </select>

                <button type="submit">
                    Adicionar Transação
                </button>

            </form>

        </section>

        <!-- Histórico -->
        <section class="historico">

            <h2>Histórico de Transações</h2>

            <div class="filtros">
                <label for="filtro-tipo">Filtrar por tipo</label>

                <select id="filtro-tipo">
                    <option value="todos">Todas</option>
                    <option value="receita">Receitas</option>
                    <option value="despesa">Despesas</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista-transacoes">
                    <!-- Transações adicionadas pelo JavaScript -->
                </tbody>
            </table>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
